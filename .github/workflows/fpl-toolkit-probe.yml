name: Verify FPL Toolkit odds access
on:
  push:
    paths:
      - '.github/workflows/fpl-toolkit-probe.yml'
      - 'fpl_toolkit_odds.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch public odds page and check markets
        run: python fpl_toolkit_odds.py
